[tool.setuptools]
packages = ["pfmp", "runner"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfmp"
version = "0.1.0"
description = "MPC in Jax"
authors = [
    { name = "Austin Garrett", email = "agarrett777@gmail.com" },
    { name = "Zachary Kingston", email = "zkingston@purdue.edu" },
]
dependencies = [
    "jax[cuda12]",
    "genjax",
    "mujoco",
    "mujoco-mjx"
]

[project.optional-dependencies]
test = [
    "matplotlib",
    "PyQt5",
    "jax_dataclasses",
    "yourdfpy",
    "jaxls",
    "jaxlie",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@main"
]
