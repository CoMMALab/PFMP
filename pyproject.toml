[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfmp"
version = "0.1.0"
description = "MPC in Jax"
authors = [
    { name = "Austin Garrett", email = "agarrett777@gmail.com" },
    { name = "Zachary Kingston", email = "zkingston@purdue.edu" },
]
dependencies = [
    "jax[cuda12]==0.10",
    "mujoco",
    "mujoco-mjx",
    "warp-lang",
    "hydrax @ git+https://github.com/vincekurtz/hydrax.git@63c715df2925b689b838dda2c7534deb292dd8f1",
    "matplotlib",
    "jax_dataclasses",
    "yourdfpy",
    "jaxls",
    "jaxlie",
    "viser",
    "pyroki @ git+https://github.com/chungmin99/pyroki.git@main",
    "PyQt5",
    "pyrealsense2",
    "opencv-python",
    "fire",
    "meshcat",
    "franky-control==1.1.1",
    "optuna>=4.8.0",
    "new-natnet-client>=6.0.1",
    "geofikinpy",
]

[tool.uv.sources]
# Vendored analytic Franka IK (GeoFIK pybind wrapper); builds the C++ ext in place.
geofikinpy = { path = "fr3/geofikinpy_src", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: compiles an MJX rollout (~10s each); deselect with -m 'not slow'",
]

[tool.setuptools.packages.find]
# Only include the pfmp package, exclude experiments
include = ["pfmp*"]
exclude = ["experiments*", "tests*"]
