# Push-T: closed-loop planar pushing. `distance` is the arena size in T-widths
# and sets both the obstacle count (int(distance) - 3) and the replan budget;
# geom_analyze overrides it per point when it sweeps that axis.
task: push_tee
distance: 4.0        # base value; the sweep overrides it per point
num: 128             # arenas per point, as reported in the paper
num_samples: 256          # match the tuning budget (geom_optuna TASK_SETUP)
seed: 42
tuned_params: experiments/checkpoints/push_tee_tune.json
# `ps` is included so this one sweep also supports the proposal-axis view
# (ps/sis, mppi/biased_mppi, cem/biased_cem are matched-update pairs).
# Each biased variant beside its unbiased counterpart.
algorithms: [sir, sis, biased_mppi, biased_cem, ps, mppi, cem, dial]

# Sweep axis for geom_runner / geom_analyze. `xticks` is the plotted coordinate
# for each value: several arena sizes share an obstacle count, and the plot
# dedupes on it.
sweep:
  name: push_tee_2d_fig
  key: distance
  values: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 7.5, 10.0]
  xticks: [0, 0, 0, 0, 1, 1, 2, 4, 7]
  xlabel: Number of obstacles
  ylabel: Success rate (%)
  metric: success
  kind: rate
