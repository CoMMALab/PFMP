# Drive: bicycle kinematics through a random box field. Arena length
# scales with the knot count, so difficulty and plan length grow together.
task: drive
num: 128           # maps
num_knots: 18
num_samples: 1024
seed: 34
# Deliberately untuned: this experiment isolates the resampling axis, so every
# method runs at library defaults and each rho pair shares hyperparameters.
# There is no `tuned_params` here on purpose.
algorithms: [ps, ps+r0.2, mppi, mppi+r0.2, cem, cem+r0.2]

sweep:
  name: drive_fig
  key: num_knots
  values:
  - 5
  - 8
  - 12
  - 18
  - 28
  xlabel: Planning horizon (knots)
  facet: none
  panels:
  - metric: collided
    kind: rate
    ylabel: Collision rate (%)
  - metric: goal_dist
    kind: cost
    ylabel: Distance to goal (median)