task: "CartPole"
# Add "learned" to run the mjlab-trained policy as the SMC proposal
# (train via examples/mjlab_cartpole.py --train).
algorithms: ["sis", "sir", "ps", "mppi", "cem", "icem", "dial", "learned", "biased_mppi"]
learned_checkpoint: null  # null/"auto" = newest mjlab run; or pin a model_*.pt path
num: 20
max_step: 1000
plan_horizon: 1.0
num_knots: 4
num_samples: 1024
noise_level: 0.3
spline_type: "linear"
mppi_temperature: 0.1
cem_num_elites: 3
cem_sigma_start: 0.5
cem_sigma_min: 0.1
dial_beta_opt_iter: 1.0
dial_beta_horizon: 1.0
dial_iterations: 5